name: Android CI

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Build release bundle
        run: gradle :app:bundleRelease --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pitlanehq-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload 0.1.0 release APK
        uses: actions/upload-artifact@v4
        with:
          name: pitlanehq-android-0.1.0
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Upload 0.1.0 release AAB
        uses: actions/upload-artifact@v4
        with:
          name: pitlanehq-android-0.1.0-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
