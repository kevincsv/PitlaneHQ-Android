name: Android CI

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the GitHub release v<version> with the files
        type: boolean
        default: false
  push:
    branches: ["master"]
    tags: ["v*"]
    paths-ignore: ["ios/**", ".github/workflows/ios.yml", "README.md", "CLAUDE.md"]
  pull_request:
    branches: ["master"]
    paths-ignore: ["ios/**", ".github/workflows/ios.yml", "README.md", "CLAUDE.md"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      # the release key lives only in GitHub secrets; without it the APK is signed with the CI debug key
      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK and bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace
      - name: Name the files
        run: |
          v="$(cat version.txt)-beta"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/PitlaneHQ-Android-$v.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/PitlaneHQ-Android-$v.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: pitlanehq-android-${{ env.VERSION }}
          path: out/*
          if-no-files-found: error
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(cat version.txt)
          tag="v$v-beta"
          # the release notes are this version's part of CHANGELOG.md
          awk -v v="$v" '$0 ~ "^## "v"( |$)" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          cat .github/release-notes.md >> notes.md
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "Pitlane HQ $v beta" --notes-file notes.md --prerelease || true
          gh release upload "$tag" out/* --clobber
