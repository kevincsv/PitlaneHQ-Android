name: iOS CI

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the GitHub release v<version> with the files
        type: boolean
        default: false
  push:
    branches: ["master"]
    tags: ["v*"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    branches: ["master"]
    paths: ["ios/**", ".github/workflows/ios.yml"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project PitlaneHQ.xcodeproj -scheme PitlaneHQ -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | grep -E "error:|warning: .*PitlaneHQ/|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log
      - name: Package unsigned .ipa
        working-directory: ios
        run: |
          v=$(grep -oE 'CFBundleShortVersionString: "[^"]+"' project.yml | cut -d'"' -f2)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          mkdir -p Payload ../out
          cp -R build/Build/Products/Release-iphoneos/PitlaneHQ.app Payload/
          zip -qry "../out/PitlaneHQ-iOS-$v-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: pitlanehq-ios-${{ env.VERSION }}
          path: out/*
          if-no-files-found: error
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${VERSION}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "Pitlane HQ $tag" --notes-file .github/release-notes.md || true
          gh release upload "$tag" out/* --clobber
